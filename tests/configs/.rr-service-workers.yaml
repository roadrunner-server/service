version: '3'

rpc:
  listen: tcp://127.0.0.1:6315

service:
  some_service_1:
    command: "php php_test_files/loop.php"
    process_num: 10
    exec_timeout: 5s # s,m,h (seconds, minutes, hours)
    remain_after_exit: false
    restart_sec: 1
  some_service_2:
    command: "php php_test_files/hello.php"
    process_num: 10
    remain_after_exit: false
    exec_timeout: 5s

version: '3'

service:
  some_service_1:
    command: "php php_test_files/loop.php"
    process_num: 10
    exec_timeout: 2s # s,m,h (seconds, minutes, hours)
    remain_after_exit: true
    restart_sec: 1
  some_service_2:
    command: "php php_test_files/hello.php"
    process_num: 10
    remain_after_exit: true
    restart_sec: 1
    exec_timeout: 2s
